spring:
  application:
    name: iot-server
  profiles:
    active: ${iot.env}


mybatis-plus:
  # Mapper XML 文件的查找位置
  mapper-locations: classpath*:/mapper/**/*.xml

  configuration:
    # 数据库 user_name 自动映射为 Java 的 userName
    map-underscore-to-camel-case: true

  global-config:
    # 关闭启动时的 MyBatis-Plus 图案
    banner: false

    db-config:
      # 使用 MyBatis-Plus 生成分布式 Long 类型ID
      id-type: assign_id

      # 统一逻辑删除字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
# IoT平台环境
iot:
  env: ${IOT_ENV:dev}

  tenant:
    enabled: true
    column: tenant_id
    tables:
      - sys_user
      - sys_role
      - sys_user_role

  auth:
    token:
      secret: ${IOT_TOKEN_SECRET:}
      issuer: iot-platform
      access-token-seconds: 7200

  bootstrap:
    admin:
      enabled: ${IOT_BOOTSTRAP_ADMIN_ENABLED:false}
      tenant-name: ${IOT_BOOTSTRAP_TENANT_NAME:平台管理租户}
      account: ${IOT_BOOTSTRAP_ADMIN_ACCOUNT:admin}
      password: ${IOT_BOOTSTRAP_ADMIN_PASSWORD:}
      real-name: ${IOT_BOOTSTRAP_ADMIN_REAL_NAME:平台管理员}
# 根据环境加载日志配置
logging:
  config: classpath:log/logback_${iot.env}.xml


server:
  port: 8081
